<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Durak</title>
		<script src="script.js" defer></script>
	</head>
	<body>
		<h1></h1>
		<h3>Connection Status: <span id="connection-status">False</span></h3>
		<h4>
			Current Lobby: <span id="current-lobby">Disconnected</span> Host:
			(<span id="lobby-host">false</span>)
		</h4>
		<h6>Players: <span id="lobby-players">N/A</span></h6>
		<h4>Username: <span id="current-name">N/A</span></h4>

		<input
			type="text"
			name="username"
			id="username"
			placeholder="Type in a username"
		/>
		<button type="submit" id="set-name">Set Username</button>

		<input
			type="text"
			name="lobby-id"
			id="lobby-id"
			placeholder="Type in a lobby ID"
		/>
		<button type="submit" id="join-lobby">Join</button>
		<br />
		<button type="submit" id="create-lobby">Create Lobby</button>
		<button type="submit" id="start-game" disabled>Start Game</button>
		<br />
		<br />
		<br />
		<div style="width: 35%">
			<div class="player-box" id="front-box" style="margin-inline: auto">
				Forward
			</div>
			<div style="display: flex; flex-direction: row; width: 100%">
				<div class="player-box" id="left-box">Left</div>
				<div class="player-box" id="right-box">Right</div>
			</div>
			<div class="player-box" id="bottom-box" style="margin-inline: auto">
				You
			</div>
		</div>

		<p>Hand: <span id="hand"></span></p>
		<p>Trump: <span id="trump"></span></p>
		<p>Deck Size: <span id="deck-size"></span></p>

		<style type="text/css">
			body {
				overflow: hidden;
				padding: 0;
				margin: 0;
				width: 100%;
				height: 100%;
			}

			.player-box {
				border: 2px solid black;
				width: 50%;
				padding-inline: 10px;
				padding-block: 16px;
				text-align: center;
			}
		</style>
	</body>
</html>
