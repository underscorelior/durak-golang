<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Durak</title>
		<script src="script.js" defer></script>
	</head>
	<body>
		<h1></h1>
		<h3>Connection Status: <span id="connection-status">False</span></h3>
		<h4>Current Lobby: <span id="current-lobby">Disconnected</span></h4>
		<h4>Username: <span id="current-name">N/A</span></h4>

		<p>Hand: <span id="hand"></span></p>

		<input
			type="text"
			name="username"
			id="username"
			placeholder="Type in a username"
		/>
		<button type="submit" id="set-name">Set Username</button>

		<input
			type="text"
			name="lobby_id"
			id="lobby_id"
			placeholder="Type in a lobby ID"
		/>
		<button type="submit" id="join-lobby">Join</button>
	</body>
</html>
